name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (defaults to the most recent draft)"
        required: false
        type: string

# The called workflow authenticates every step with the ESPHome GitHub App
# token (via vars.ESPHOME_GITHUB_APP_CLIENT_ID and the inherited
# ESPHOME_GITHUB_APP_PRIVATE_KEY secret) so that publishing fires a
# `release: published` event downstream. The called job still declares
# contents: write (for its GITHUB_TOKEN fallback), and a reusable workflow
# cannot exceed the caller's permissions, so grant it here. It also runs in
# this repo's `release` environment.
permissions:
  contents: write

jobs:
  release:
    name: Publish draft release
    # Patches the draft release's manifest assets with the final release
    # notes, then publishes it - all by release id, immune to the
    # draft-by-tag lookup and draft-untagging API pitfalls.
    uses: esphome/workflows/.github/workflows/publish-draft-release.yml@31d160e5f0ffa0ee65d5b27cb55c153d415f2abe  # 2026.10.2
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit
